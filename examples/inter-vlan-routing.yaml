version: 1
project: inter-vlan-routing

devices:
  - id: r1
    type: router
    model: "2911"
  - id: sw1
    type: switch
    model: 2960-24TT
  - id: pc1
    type: pc
    model: PC-PT
  - id: pc2
    type: pc
    model: PC-PT

links:
  - from: pc1:FastEthernet0
    to: sw1:FastEthernet0/1
  - from: pc2:FastEthernet0
    to: sw1:FastEthernet0/2
  - from: r1:GigabitEthernet0/0
    to: sw1:GigabitEthernet0/1

vlans:
  - id: 10
    name: FINANCE
  - id: 20
    name: GUEST

vlan_assignments:
  - device: sw1
    port: FastEthernet0/1
    mode: access
    vlan: 10
  - device: sw1
    port: FastEthernet0/2
    mode: access
    vlan: 20
  - device: sw1
    port: GigabitEthernet0/1
    mode: trunk
    native_vlan: 1
    allowed_vlans: [1, 10, 20]

ipv4:
  - device: r1
    port: GigabitEthernet0/0.10
    parent_port: GigabitEthernet0/0
    dot1q_vlan: 10
    address: 192.168.10.1/24
  - device: r1
    port: GigabitEthernet0/0.20
    parent_port: GigabitEthernet0/0
    dot1q_vlan: 20
    address: 192.168.20.1/24
  - device: pc1
    port: FastEthernet0
    address: 192.168.10.10/24
    gateway: 192.168.10.1
  - device: pc2
    port: FastEthernet0
    address: 192.168.20.20/24
    gateway: 192.168.20.1

verification:
  connectivity:
    - name: inter-vlan-routing
      source: pc1
      destination: pc2
      expected: pass
