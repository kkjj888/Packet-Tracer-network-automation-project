version: 1
project: static-site-routing

devices:
  - id: r1
    type: router
    model: "2911"
  - id: r2
    type: router
    model: "2911"
  - id: pc1
    type: pc
    model: PC-PT
  - id: pc2
    type: pc
    model: PC-PT

links:
  - from: pc1:FastEthernet0
    to: r1:GigabitEthernet0/0
  - from: pc2:FastEthernet0
    to: r2:GigabitEthernet0/0
  - from: r1:GigabitEthernet0/1
    to: r2:GigabitEthernet0/1

ipv4:
  - device: r1
    port: GigabitEthernet0/0
    address: 172.16.10.1/24
  - device: r1
    port: GigabitEthernet0/1
    address: 10.0.0.1/30
  - device: r2
    port: GigabitEthernet0/0
    address: 172.16.20.1/24
  - device: r2
    port: GigabitEthernet0/1
    address: 10.0.0.2/30
  - device: pc1
    port: FastEthernet0
    address: 172.16.10.10/24
    gateway: 172.16.10.1
  - device: pc2
    port: FastEthernet0
    address: 172.16.20.20/24
    gateway: 172.16.20.1

routing:
  static:
    - device: r1
      network: 0.0.0.0/0
      next_hop: 10.0.0.2
      interface: GigabitEthernet0/1
    - device: r2
      network: 172.16.10.0/24
      next_hop: 10.0.0.1
      interface: GigabitEthernet0/1

verification:
  connectivity:
    - name: static-route-between-sites
      source: pc1
      destination: pc2
      expected: pass
  route_assertions:
    - device: r1
      destination: 0.0.0.0/0
      protocol: static
      next_hop: 10.0.0.2
      admin_distance: 1
    - device: r2
      destination: 172.16.10.0/24
      protocol: static
      next_hop: 10.0.0.1
      admin_distance: 1
  traceroute_tests:
    - name: static-path
      source: pc1
      destination: pc2
      expected_hops:
        - 172.16.10.1
        - 10.0.0.2
        - 172.16.20.20
