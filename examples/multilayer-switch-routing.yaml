version: 1
project: multilayer-switch-routing-smoke

devices:
  - id: core1
    type: multilayer_switch
    model: 3560-24PS
  - id: pc1
    type: pc
    model: PC-PT
  - id: pc2
    type: pc
    model: PC-PT

links:
  - from: core1:FastEthernet0/2
    to: pc1:FastEthernet0
  - from: core1:FastEthernet0/3
    to: pc2:FastEthernet0

vlans:
  - id: 10
    name: USERS

vlan_assignments:
  - device: core1
    port: FastEthernet0/2
    mode: access
    vlan: 10
  - device: core1
    port: FastEthernet0/3
    mode: access
    vlan: 10

svis:
  - device: core1
    vlan: 10
    address: 192.168.10.1/24

switch_routing: [core1]

ipv4:
  - device: pc1
    port: FastEthernet0
    address: 192.168.10.10/24
    gateway: 192.168.10.1
  - device: pc2
    port: FastEthernet0
    address: 192.168.10.11/24
    gateway: 192.168.10.1

verification:
  connectivity:
    - name: multilayer-svi-routing
      source: pc1
      destination: pc2
      expected: pass
