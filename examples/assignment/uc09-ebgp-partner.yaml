version: 1
project: uc09-ebgp-partner

devices:
  - {id: R1, type: router, model: "2911"}
  - {id: R2, type: router, model: "2911"}
  - {id: SW1, type: switch, model: 2960-24TT}
  - {id: PC1, type: pc, model: PC-PT}
  - {id: PC2, type: pc, model: PC-PT}

links:
  - {from: R1:GigabitEthernet0/0, to: SW1:FastEthernet0/1}
  - {from: R2:GigabitEthernet0/0, to: SW1:FastEthernet0/2}
  - {from: PC1:FastEthernet0, to: SW1:FastEthernet0/3}
  - {from: PC2:FastEthernet0, to: R2:GigabitEthernet0/1}

ipv4:
  - {device: R1, port: GigabitEthernet0/0, address: 10.0.0.1/24}
  - {device: R2, port: GigabitEthernet0/0, address: 10.0.0.2/24}
  - {device: R2, port: GigabitEthernet0/1, address: 20.0.0.254/24}
  - {device: PC1, port: FastEthernet0, address: 10.0.0.10/24, gateway: 10.0.0.1}
  - {device: PC2, port: FastEthernet0, address: 20.0.0.10/24, gateway: 20.0.0.254}

routing:
  bgp:
    devices:
      - device: R1
        local_as: 100
        router_id: 10.0.0.1
        neighbors:
          - {address: 10.0.0.2, remote_as: 200}
        networks: [10.0.0.0/24]
      - device: R2
        local_as: 200
        router_id: 20.0.0.254
        neighbors:
          - {address: 10.0.0.1, remote_as: 100}
        networks: [20.0.0.0/24]

verification:
  connectivity:
    - {name: partner-prefix-connectivity, source: PC1, destination: PC2, expected: pass}
  route_assertions:
    - {device: R1, destination: 20.0.0.0/24, protocol: bgp, next_hop: 10.0.0.2, admin_distance: 20}
    - {device: R2, destination: 10.0.0.0/24, protocol: connected, interface: GigabitEthernet0/0, admin_distance: 0}
  device_output_assertions:
    - {name: r1-bgp-established, device: R1, command: show ip bgp neighbors, expected_contains: ["BGP state = Established"]}
    - {name: r2-bgp-established, device: R2, command: show ip bgp neighbors, expected_contains: ["BGP state = Established"]}
