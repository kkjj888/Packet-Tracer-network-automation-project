switch_routing: [CORE1]

vlans:
  - {id: 10, name: DEPT10}
  - {id: 20, name: DEPT20}

svis:
  - {device: CORE1, vlan: 10, address: 192.168.1.254/24}
  - {device: CORE1, vlan: 20, address: 192.168.2.254/24}

vlan_assignments:
  - {device: CORE1, port: FastEthernet0/1, mode: access, vlan: 10}
  - {device: CORE1, port: FastEthernet0/2, mode: access, vlan: 10}
  - {device: CORE1, port: FastEthernet0/3, mode: access, vlan: 10}
  - {device: CORE1, port: FastEthernet0/4, mode: access, vlan: 20}
  - {device: CORE1, port: FastEthernet0/5, mode: access, vlan: 20}
  - {device: CORE1, port: FastEthernet0/6, mode: access, vlan: 20}

ipv4:
